<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1230">
<title>Math Duel</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Pieteikšanās -->
<section id="screen-login" class="screen active">
  <div class="card">
    <div id="login-lang" class="lang-switch"></div>
    <h1 class="logo"><span data-i18n="logo.a"></span><span class="logo-b" data-i18n="logo.b"></span></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <label class="field">
      <span data-i18n="login.nick"></span>
      <input id="in-nick" type="text" maxlength="20" autocomplete="off" data-i18n-ph="login.nickPh">
    </label>
    <label class="field">
      <span data-i18n="login.pin"></span>
      <input id="in-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">
    </label>
    <button id="btn-login" class="btn primary big" data-i18n="login.btn"></button>
    <p id="login-error" class="error"></p>
    <p class="hint" data-i18n="login.hint"></p>
  </div>
</section>

<!-- Lobby -->
<section id="screen-lobby" class="screen">
  <header class="topbar">
    <div class="me">
      <span class="me-nick" id="lobby-nick">—</span>
      <span class="me-rating" id="lobby-rating">—</span>
    </div>
    <div class="topbar-actions">
      <button id="btn-settings" class="btn ghost small" data-i18n="lobby.settings"></button>
      <button id="btn-board" class="btn ghost small" data-i18n="lobby.board"></button>
    </div>
  </header>

  <div class="card">
    <h2 data-i18n="lobby.level"></h2>
    <div id="level-grid" class="grid-levels"></div>

    <h2><span data-i18n="lobby.formats"></span> <span class="h2-hint" data-i18n="lobby.formatsHint"></span></h2>
    <div id="format-row" class="pill-row"></div>

    <h2 data-i18n="lobby.ops"></h2>
    <div id="ops-row" class="pill-row"></div>

    <div class="actions">
      <button id="btn-quick" class="btn primary big" data-i18n="lobby.quick"></button>
      <div class="or" data-i18n="lobby.or"></div>
      <div class="friend-row">
        <button id="btn-create" class="btn secondary" data-i18n="lobby.create"></button>
        <div class="join-inline">
          <input id="in-code" type="text" maxlength="4" data-i18n-ph="lobby.codePh" autocomplete="off">
          <button id="btn-join" class="btn secondary" data-i18n="lobby.join"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" id="history-card">
    <h2 data-i18n="lobby.history"></h2>
    <ul id="history-list" class="history"></ul>
  </div>
</section>

<!-- Gaidīšana / kods -->
<section id="screen-wait" class="screen">
  <div class="card center">
    <div class="spinner"></div>
    <h2 id="wait-title"></h2>
    <div id="wait-code" class="code-box" hidden>
      <p data-i18n="wait.sendCode"></p>
      <div class="code" id="code-value">----</div>
      <button id="btn-share" class="btn secondary" data-i18n="wait.share"></button>
      <p class="hint" data-i18n="wait.codeHint"></p>
    </div>
    <button id="btn-cancel-wait" class="btn ghost" data-i18n="wait.cancel"></button>
  </div>
</section>

<!-- Atpakaļskaitīšana -->
<section id="screen-countdown" class="screen">
  <div class="countdown-wrap">
    <div class="vs">
      <span id="cd-you" class="vs-name">—</span>
      <span class="vs-x">VS</span>
      <span id="cd-opp" class="vs-name">—</span>
    </div>
    <div id="cd-number" class="cd-number">3</div>
  </div>
</section>

<!-- Duelis -->
<section id="screen-duel" class="screen">
  <div class="scoreboard">
    <div class="sb-player" id="sb-you">
      <span class="sb-name">—</span>
      <span class="sb-score">0</span>
      <span class="sb-delta"></span>
    </div>
    <div class="sb-timer">
      <div class="timer-bar"><div id="timer-fill" class="timer-fill"></div></div>
      <span id="timer-text">0:00</span>
    </div>
    <div class="sb-player right" id="sb-opp">
      <span class="sb-name">—</span>
      <span class="sb-score">0</span>
      <span class="sb-delta"></span>
    </div>
  </div>

  <div class="question-area">
    <div id="transition-circle" class="transition-circle"></div>
    <div id="question-text" class="question">—</div>
    <div id="answer-display" class="answer-display">&nbsp;</div>
    <div id="round-flash" class="round-flash">
      <div id="rf-main" class="rf-main"></div>
      <div id="rf-sub" class="rf-sub"></div>
    </div>
  </div>

  <div class="numpad" id="numpad"></div>
</section>

<!-- Rezultāts -->
<section id="screen-result" class="screen">
  <div class="card center">
    <div id="result-badge" class="result-badge">—</div>
    <div id="result-note" class="hint"></div>
    <div class="result-scores">
      <span id="result-you-score">0</span>
      <span class="colon">:</span>
      <span id="result-opp-score">0</span>
    </div>
    <div id="result-rating" class="result-rating">—</div>
    <div id="rematch-status" class="hint"></div>
    <div class="actions">
      <button id="btn-rematch" class="btn primary big" data-i18n="result.rematch"></button>
      <button id="btn-lobby" class="btn ghost" data-i18n="result.lobby"></button>
    </div>
  </div>
</section>

<!-- Tops -->
<section id="screen-board" class="screen">
  <header class="topbar">
    <button id="btn-board-back" class="btn ghost small" data-i18n="board.back"></button>
    <h2 class="board-title" data-i18n="board.title"></h2>
  </header>
  <div class="card">
    <div id="board-levels" class="pill-row small-pills"></div>
    <ol id="board-list" class="board"></ol>
  </div>
</section>

<!-- Iestatījumi -->
<section id="screen-settings" class="screen">
  <header class="topbar">
    <button id="btn-settings-back" class="btn ghost small" data-i18n="board.back"></button>
    <h2 class="board-title" data-i18n="settings.title"></h2>
  </header>
  <div class="card">
    <h2 data-i18n="settings.lang"></h2>
    <div id="lang-row" class="pill-row"></div>

    <h2 data-i18n="settings.numpad"></h2>
    <div id="numpad-layout-row" class="pill-row"></div>
    <div class="numpad-preview" id="numpad-preview"></div>

    <h2 data-i18n="settings.tol"></h2>
    <div id="tol-row" class="pill-row"></div>
    <p class="hint" data-i18n="settings.tolHint"></p>

    <h2 data-i18n="settings.vibrate"></h2>
    <div id="vibrate-row" class="pill-row"></div>

    <div class="actions">
      <button id="btn-logout" class="btn ghost" data-i18n="lobby.logout"></button>
    </div>
  </div>
</section>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
